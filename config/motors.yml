# Motor configuration for ExampleBot (four-wheel mecanum drivetrain).
#
# ticks_to_rad: how many radians one encoder tick represents.
#   Formula: ticks_to_rad = (2 * pi) / ticks_per_revolution
#   Ticks per revolution = raw encoder ticks observed when the WHEEL (not motor shaft)
#   completes one full rotation. For raccoonOS motors this is typically ~360 000 – 420 000,
#   giving ticks_to_rad values in the range 1.5e-05 – 1.75e-05.
#
#   Common mistake: entering the raw tick count (e.g. 400000) as ticks_to_rad
#   instead of computing 2π/400000 ≈ 1.57e-05. That makes the controller think
#   every tick moves the wheel by 400 000 radians and the robot will not move.
#
#   To measure your own ticks_per_revolution:
#     1. Note the encoder position via BotUI > Sensors or raccoon shell.
#     2. Manually rotate the wheel one full revolution.
#     3. Note the new encoder position; the difference is ticks_per_revolution.
#     4. Compute ticks_to_rad = (2 * pi) / ticks_per_revolution.
#
# vel_lpf_alpha: low-pass filter strength on the measured wheel velocity.
#   1.0 = no filtering (raw, noisy). 0.1 = heavy filtering (slow to react).
#   Leave at 1.0 unless you see noisy velocity readings in the logs.

# Wheel naming / ports (viewed from above, robot facing forward):
#
#     front_left (0)  ┌───────┐  front_right (1)
#                     │       │
#     rear_left  (2)  └───────┘  rear_right  (3)
#
# The right-hand motors are mounted mirrored, so they are `inverted: true`.
# If the robot drives the wrong way or spins instead of driving straight, the
# fix is almost always one of these `inverted` flags — see the mecanum notes in
# README.md for the quick wheel-by-wheel test.
#
# The ticks_to_rad values below are placeholders: measure each wheel for your
# own robot (the four wheels usually differ slightly).

front_left_motor:
  type: Motor
  port: 0
  inverted: false
  calibration:
    ticks_to_rad: 1.741e-05
    vel_lpf_alpha: 1.0

front_right_motor:
  type: Motor
  port: 1
  inverted: true   # mirrored → invert
  calibration:
    ticks_to_rad: 1.741e-05
    vel_lpf_alpha: 1.0

rear_left_motor:
  type: Motor
  port: 2
  inverted: false
  calibration:
    ticks_to_rad: 1.741e-05
    vel_lpf_alpha: 1.0

rear_right_motor:
  type: Motor
  port: 3
  inverted: true   # mirrored → invert
  calibration:
    ticks_to_rad: 1.741e-05
    vel_lpf_alpha: 1.0
