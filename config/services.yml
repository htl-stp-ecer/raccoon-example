# ── Background services ───────────────────────────────────────────────────────
# Long-running daemons that are deployed with the project and managed on the
# Wombat (e.g. a camera/vision process). The example robot has none, so this is
# an empty mapping. To add one, uncomment and adapt the template:
#
# vision:
#   module: src.daemons.vision        # python module started as the daemon
#   restart: always                   # restart policy if it exits
#   restart_sec: 1                    # delay before a restart
#   after_sync: restart_if_changed    # restart when watched files changed on sync
#   required_for_run: true            # `raccoon run` waits for it to be up
#   watch:                            # files whose change triggers the restart
#     - src/daemons/vision.py
{}
