name: Bump raccoon pins

# The raccoon-cli and raccoon-library pins of the template branches (differential,
# mecanum) move together, and only when a bundle is made: the Create Bundle
# workflow in raccoon-image sends "bundle-released" with the versions of the
# bundle. Nothing else moves the pins (the old cli-released / lib-released
# triggers are gone).
#
# Each template branch gets one commit that moves both pins to exactly the
# bundle's versions, also when they are older than the current ones: the bundle
# is the tested truth. The commit is pushed straight to the branch (no pull
# request); a run without a change commits nothing.
#
# This workflow lives on main on purpose: repository_dispatch only runs
# workflows from the default branch, and anything under .github/ in a template
# branch would be copied into every project created with raccoon-setup.
#
# By hand: give both versions, or leave them empty for the newest on PyPI.

on:
  repository_dispatch:
    types: [bundle-released]
  workflow_dispatch:
    inputs:
      cli_version:
        description: raccoon-cli version to pin (empty = latest on PyPI)
        required: false
      lib_version:
        description: raccoon-library version to pin (empty = latest on PyPI)
        required: false

permissions:
  contents: read

jobs:
  versions:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.what.outputs.cli }}
      lib: ${{ steps.what.outputs.lib }}
      bundle: ${{ steps.what.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Work out the versions
        id: what
        env:
          EVENT: ${{ github.event_name }}
          PAYLOAD_BUNDLE: ${{ github.event.client_payload.bundle }}
          PAYLOAD_CLI: ${{ github.event.client_payload.cli }}
          PAYLOAD_LIB: ${{ github.event.client_payload.lib }}
          INPUT_CLI: ${{ inputs.cli_version }}
          INPUT_LIB: ${{ inputs.lib_version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request

          sys.path.insert(0, "scripts")
          from bump_pins import normalize_version

          def latest(package):
              with urllib.request.urlopen(f"https://pypi.org/pypi/{package}/json") as response:
                  return json.load(response)["info"]["version"]

          if os.environ["EVENT"] == "repository_dispatch":
              cli, lib = os.environ["PAYLOAD_CLI"], os.environ["PAYLOAD_LIB"]
              bundle = os.environ["PAYLOAD_BUNDLE"]
          else:
              cli = os.environ["INPUT_CLI"] or latest("raccoon-cli")
              lib = os.environ["INPUT_LIB"] or latest("raccoon-library")
              bundle = ""
          cli, lib = normalize_version(cli), normalize_version(lib)
          # The bundle name ends up in a title and a branch body only.
          import re
          if bundle and not re.fullmatch(r"\d{4}\.\d{2}\.\d{2}(-\d+)?", bundle):
              raise SystemExit(f"::error::'{bundle}' is not a bundle name")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"cli={cli}\nlib={lib}\nbundle={bundle}\n")
          print(f"raccoon-cli {cli}, raccoon-library {lib}, bundle {bundle or '(none)'}")
          PY

      - name: Wait until both versions are on PyPI
        env:
          CLI: ${{ steps.what.outputs.cli }}
          LIB: ${{ steps.what.outputs.lib }}
        run: |
          for pair in "raccoon-cli $CLI" "raccoon-library $LIB"; do
            set -- $pair
            ok=false
            for _ in $(seq 1 40); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$1/$2/json")
              if [ "$code" = 200 ]; then ok=true; echo "$1 $2 is on PyPI"; break; fi
              sleep 15
            done
            if [ "$ok" != true ]; then
              echo "::error::$1 $2 is not on PyPI after 10 minutes"
              exit 1
            fi
          done

  bump:
    needs: versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        branch: [differential, mecanum]

    steps:
      # The tools come from main, the template from its own branch; separate
      # paths so neither checkout touches the other.
      - uses: actions/checkout@v4
        with:
          path: tools
          sparse-checkout: scripts

      # The push comes from raccoon-os-bot with the app token, so checks run on
      # the new commit (a push with the default token starts no workflows).
      - name: Create an app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          owner: htl-stp-ecer
          repositories: raccoon-example
          permission-contents: write

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          path: template
          token: ${{ steps.app-token.outputs.token }}

      - name: Move the pins
        id: bump
        run: |
          python3 tools/scripts/bump_pins.py --pyproject template/pyproject.toml \
            --cli "${{ needs.versions.outputs.cli }}" --lib "${{ needs.versions.outputs.lib }}"

      - name: Commit and push to the branch
        working-directory: template
        env:
          BRANCH: ${{ matrix.branch }}
          BUNDLE: ${{ needs.versions.outputs.bundle }}
          CLI: ${{ needs.versions.outputs.cli }}
          LIB: ${{ needs.versions.outputs.lib }}
        run: |
          if git diff --quiet -- pyproject.toml; then
            echo "Pins on $BRANCH already match, nothing to commit."
            exit 0
          fi
          git config user.name  "raccoon-os-bot[bot]"
          git config user.email "raccoon-os-bot[bot]@users.noreply.github.com"
          git add pyproject.toml
          git commit -m "chore: bump raccoon pins${BUNDLE:+ to bundle $BUNDLE} (cli $CLI, library $LIB)"
          # Someone may have pushed to the branch meanwhile: take it in and retry.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then exit 0; fi
            echo "push rejected (attempt $attempt), retrying"
            git pull --rebase origin "$BRANCH"
          done
          echo "::error::could not push the pins to $BRANCH after 3 attempts"
          exit 1
